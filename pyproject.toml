[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snyk-migration-graft"
version = "0.1.0"
description = "Vendored Python modules for Snyk migration issue enrichment (predecessor matching, date/id graft in Pharos pipelines)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.9.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = []

[project.scripts]
snyk-correlate = "snyk_correlate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["snyk_correlate*"]
